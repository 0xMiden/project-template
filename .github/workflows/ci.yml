name: CI

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  integration_tests:
    name: Run integration tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: |
        rustup update --no-self-update
        rustc --version
    - name: Install frozen Miden compiler
      run: |
        set -euo pipefail
        MIDEN_CARGO_HOME="${CARGO_HOME:-${HOME:?HOME must be set}/.cargo}"
        MIDEN_V16_TOOL_ROOT="$MIDEN_CARGO_HOME/miden-v16-0.10.0-rc.1"
        COMPILER_PIPELINE_COMMIT=2a5ebf830c910aa5f7bf53ee4df398915ab12f7a

        cargo install cargo-miden --git https://github.com/0xMiden/compiler \
          --rev "$COMPILER_PIPELINE_COMMIT" --locked --root "$MIDEN_V16_TOOL_ROOT"

        test "$("$MIDEN_V16_TOOL_ROOT/bin/cargo-miden" miden --version)" = \
          'cargo-miden 0.10.0-rc.1'
    - name: Build contracts
      run: |
        set -euo pipefail
        MIDEN_CARGO_HOME="${CARGO_HOME:-${HOME:?HOME must be set}/.cargo}"
        CARGO_MIDEN_BIN="$MIDEN_CARGO_HOME/miden-v16-0.10.0-rc.1/bin/cargo-miden"

        "$CARGO_MIDEN_BIN" miden build \
          --manifest-path contracts/counter-account/Cargo.toml --release
        "$CARGO_MIDEN_BIN" miden build \
          --manifest-path contracts/increment-note/Cargo.toml --release
    - name: Run integration tests
      run: cargo test --locked -p integration --release
